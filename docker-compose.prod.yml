# Production stack for beta.rpiforge.dev on the Azure VM.
#
#   docker-compose -f docker-compose.prod.yml up -d --build
#
# The VM's existing nginx handles HTTPS (certbot) and forwards
# beta.rpiforge.dev to 127.0.0.1:8080 - see deploy/nginx/beta.rpiforge.dev.conf
#
# Needs these files on the server (never commit them):
#   backend/.env.prod     (copy backend/.env.prod.example)
#   database/.env.prod    (copy database/.env.prod.example)

services:
  postgres:
    # alpine: the Debian image needs Docker 20.10.10+, the VM has 19.03
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ./database/.env.prod
    environment:
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    # No ports published: only reachable by other containers

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./backend/.env.prod
    environment:
      - ENVIRONMENT=PRD
      - DEFAULT_DATABASE_HOSTNAME=postgres
      - DEFAULT_DATABASE_PORT=5432

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - SITE_DOMAIN=:80       # plain HTTP; nginx in front does HTTPS
    ports:
      - "127.0.0.1:8080:80"   # only reachable from the VM itself (nginx)
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

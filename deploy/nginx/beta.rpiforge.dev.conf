# nginx site for beta.rpiforge.dev on the production VM.
# Install:
#   sudo cp deploy/nginx/beta.rpiforge.dev.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/beta.rpiforge.dev.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d beta.rpiforge.dev     # adds HTTPS to this file
server {
    listen 80;
    listen [::]:80;
    server_name beta.rpiforge.dev;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
